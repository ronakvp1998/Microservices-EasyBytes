spring:
  application:
    name: "configserver"

  profiles:
#    active: native
    active: git
  cloud:
    config:
      server:
#        native:
#          search-locations: "classpath:/config"
#         search-locations: "file:///C://Users//ronak//OneDrive//Documents//config"
        git:
          uri: "https://github.com/ronakvp1998/config.git"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
management:
  endpoints:
    web:
      exposure:
        include: '*'
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8071

encrypt:
  key: 1234